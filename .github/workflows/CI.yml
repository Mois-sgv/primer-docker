# 1. Nombre del flujo de trabajo que se mostrará en la interfaz web de GitHub
name: Test Ubuntu Hola Mundo
run-name: Deploy in live by ${{ github.actor }}

# 2. Define los "Disparadores" (Triggers). Especifica CUÁNDO debe ejecutarse este pipeline
on:
  push:
    branches: [ main ]

# =========================================================================
# 🗂️ VARIABLES GLOBALES (Perfectamente alineadas en la raíz del archivo)
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 3. Bloque principal que contiene el conjunto de tareas (trabajos) a realizar
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # PASO 1: Clonar el código del repositorio
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      # PASO 2: Pruebas automatizadas Pre-flight (¡Que ya funcionan de 10!)
      - name: Ejecutar pruebas de calidad del codigo
        run: |
          echo "Iniciando pruebas de Pre-flight..."
          if [ ! -f "app.sh" ]; then
            echo "❌ ERROR: Falta app.sh"
            exit 1
          fi
          if [ ! -s "app.sh" ]; then
            echo "❌ ERROR: app.sh vacio"
            exit 1
          fi
          echo "¡Pruebas superadas con exito!"

      # =========================================================================
      # 🚀 PASO CORRECTIVO CRÍTICO: Levantar el motor Buildx avanzado
      # =========================================================================
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PASO 4: Iniciar sesión en GitHub Container Registry de forma segura
      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PASO 5: Compilar y guardar con soporte completo de caché exportable
      - name: Construir y subir Imagen Docker con Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max