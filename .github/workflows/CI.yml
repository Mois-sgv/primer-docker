# 1. Nombre del flujo de trabajo que se mostrará en la interfaz web de GitHub
name: Test Ubuntu Hola Mundo
run-name: Deploy in live by ${{ github.actor }}

# 2. Define los "Disparadores" (Triggers). Especifica CUÁNDO debe ejecutarse este pipeline
on:
  push:
    # El flujo se activará automáticamente cada vez que hagas un 'git push' a la rama 'main'
    branches: [ main ]

# =========================================================================
# 🗂️ SOLUCIÓN: Sacamos 'env' de la sangría de 'on' y lo pegamos al borde izquierdo
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 3. Bloque principal que contiene el conjunto de tareas (trabajos) a realizar
jobs:
  # Nombre interno del trabajo (puedes ponerle el nombre que quieras)
  build-and-test:
    # Especifica el sistema operativo del servidor virtual (Runner) que nos regala GitHub.
    runs-on: ubuntu-latest
    
    # Otorgamos permisos explícitos para escribir y guardar paquetes en tu perfil de GitHub
    permissions:
      contents: read
      packages: write

    # 4. Lista secuencial de pasos que ejecutará el servidor virtual de GitHub
    steps:
      # PASO 1: Utiliza una acción oficial de GitHub para clonar tu código dentro del servidor virtual.
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar pruebas de calidad del codigo
        run: |
          echo "Iniciando pruebas automáticas de Pre-flight..."
          
          # Test 1: Verificar si el archivo app.sh existe realmente
          if [ ! -f "app.sh" ]; then
            echo "❌ ERROR CRÍTICO: El archivo app.sh no existe en el repositorio."
            exit 1
          fi
          echo "✅ Test 1 aprobado: El archivo app.sh está presente."
          
          # Test 2: Verificar si el archivo app.sh tiene contenido adentro
          if [ ! -s "app.sh" ]; then
            echo "❌ ERROR CRÍTICO: El archivo app.sh está completamente vacío."
            exit 1
          fi
          echo "✅ Test 2 aprobado: El archivo contiene código ejecutable."
          
          echo "¡Todas las pruebas automatizadas pasaron con éxito! Procediendo a Docker..."

      # =========================================================================
      # LOS PASOS DE DOCKER CONTINÚAN DE FORMA SEGURA ABAJO
      # =========================================================================
      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir Imagen Docker con Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
